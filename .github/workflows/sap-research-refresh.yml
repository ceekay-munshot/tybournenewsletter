name: Refresh SAP research (monthly)

# The SAP AI Strategy dashboard scores practitioner sentiment DAILY, but its
# "Key Findings" (the lifted why-it-moved research) come from an expensive deep
# pass in the source repo (ceekay-munshot/sap) that "never runs on a schedule —
# someone has to ask for it". Left alone those findings go stale while the daily
# scores keep moving. Per the client, we re-run that research once a month so each
# edition's SAP explanations are current. The source repo's research workflow
# already listens for a repository_dispatch of type "research"; this just presses
# that button on a schedule. The refreshed findings land in the sap repo's
# dashboard.json, and our next 6-hourly "Refresh consolidated data" run lifts them.
#
# OPTIONAL + gated, like the email workflow: if SAP_RESEARCH_DISPATCH_TOKEN isn't
# set, this logs a notice and exits 0 — it never fails just because it isn't wired.
# The token is a fine-grained PAT (or classic token) with permission to trigger
# Actions / write contents on ceekay-munshot/sap. See README "Secrets & variables".
#
# Simpler alternative (no cross-repo token): add this same monthly `schedule` block
# directly to ceekay-munshot/sap's .github/workflows/research.yml, which already has
# the Firecrawl + model secrets it needs.
on:
  schedule:
    # 1st of every month, 06:00 UTC — ahead of the newsletter so findings are fresh.
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Research a single topic id (blank = all nine)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: sap-research-refresh
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the SAP deep-research run
        env:
          TOKEN: ${{ secrets.SAP_RESEARCH_DISPATCH_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::SAP_RESEARCH_DISPATCH_TOKEN not set — skipping the monthly SAP research trigger (expected until configured)."
            exit 0
          fi
          # ONLY comes from workflow inputs (trusted), but pass it via jq so the JSON
          # is always well-formed rather than string-interpolated.
          payload=$(jq -nc --arg only "$ONLY" '{event_type:"research", client_payload:{only:$only}}')
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ceekay-munshot/sap/dispatches \
            -d "$payload")
          if [ "$code" = "204" ]; then
            echo "Dispatched SAP research run (repository_dispatch type=research)."
          else
            echo "::error::SAP research dispatch failed (HTTP $code)."
            cat /tmp/resp.txt
            exit 1
          fi
