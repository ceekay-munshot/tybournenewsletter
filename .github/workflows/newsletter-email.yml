name: Email monthly newsletter

# Every month, render the in-app edition to a PDF and email it to the recipient list —
# exactly once. The AI prose is this month's edition, written by "Refresh consolidated
# data" (no AI call here).
#
# Built so a month can't be missed silently:
#   - Many chances: "Refresh consolidated data" starts this workflow the moment this
#     month's edition is pushed, and the schedule below retries twice a day from the 2nd
#     to the 9th (GitHub delays scheduled runs by hours and sometimes drops them).
#   - Once a month: a successful send is recorded in clients/tybourne/data/email-log.json
#     (committed here); every later run that month is a quick no-op.
#   - Never silent: missing MUNSHOT_EMAIL_TOKEN / NEWSLETTER_RECIPIENTS FAILS the run (it
#     used to skip with a green tick), and so does an edition still missing 48h after due.
#     A failed scheduled run emails the repo owner.
#   - Never stale: it only sends once this month's AI edition is on file, so it can't race
#     ahead of a late edition run and send last month's.
# To resend, or to send without a fresh AI edition, run it by hand with "force" ticked.
# To send a TEST of the current edition to yourself first, run it by hand with
# "recipient_override" set to your address (e.g. ceekay@muns.io): it sends ONLY there
# and does not record the monthly send — so the real monthly send to the client still
# goes out normally afterwards.
on:
  schedule:
    - cron: '17 7,19 2-9 * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Send now even if this month was already sent or this month's AI edition isn't ready"
        type: boolean
        default: false
      recipient_override:
        description: "TEST: send this run to ONLY these comma-separated address(es) (e.g. ceekay@muns.io) instead of the real list. Implies force and is NOT recorded as the monthly send — the real send still goes out."
        type: string
        required: false

permissions:
  contents: write # commit the send log

concurrency:
  group: newsletter-email
  cancel-in-progress: false

jobs:
  # Decides whether to send. Fails loudly if email isn't configured or the edition is
  # overdue; succeeds quietly if this month already went out or the edition is on its way.
  gate:
    runs-on: ubuntu-latest
    outputs:
      send: ${{ steps.check.outputs.send }}
      month: ${{ steps.check.outputs.month }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: check
        name: Should this month's newsletter go out now?
        env:
          MUNSHOT_EMAIL_TOKEN: ${{ secrets.MUNSHOT_EMAIL_TOKEN }}
          # A recipient_override makes this a test to that address only; otherwise the real list.
          NEWSLETTER_RECIPIENTS: ${{ (inputs.recipient_override != '' && inputs.recipient_override != null) && inputs.recipient_override || vars.NEWSLETTER_RECIPIENTS }}
          # An override run is a manual test, so it forces past the "already sent / not current" gates.
          FORCE: ${{ inputs.force == true || (inputs.recipient_override != '' && inputs.recipient_override != null) }}
        run: node scripts/edition-check.mjs email

  send:
    needs: gate
    if: needs.gate.outputs.send == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Consolidate (all clients)
        run: node scripts/consolidate.mjs

      - name: Build site
        run: npm run build

      - name: Install Chromium for Playwright
        run: |
          npm i playwright@1.48.0 --no-save
          for i in 1 2 3; do
            npx --yes playwright@1.48.0 install --with-deps chromium && exit 0
            echo "Chromium install attempt $i failed; retrying in $((15 * i))s..."
            sleep $((15 * i))
          done
          exit 1

      - name: Render newsletter PDF
        env:
          # Set SITE_URL (repo variable) to render the DEPLOYED route instead of ./dist.
          SITE_URL: ${{ vars.SITE_URL }}
          NEWSLETTER_PDF: ${{ github.workspace }}/tybourne-intelligence.pdf
        run: node scripts/render-newsletter-pdf.mjs

      - name: Email newsletter
        env:
          MUNSHOT_EMAIL_TOKEN: ${{ secrets.MUNSHOT_EMAIL_TOKEN }}
          EMAIL_API_URL: ${{ vars.EMAIL_API_URL }}
          # Linked in the email body so the edition is reachable even if the PDF is too large to attach.
          SITE_URL: ${{ vars.SITE_URL }}
          # Test override → that address only; otherwise the real recipient list.
          NEWSLETTER_RECIPIENTS: ${{ (inputs.recipient_override != '' && inputs.recipient_override != null) && inputs.recipient_override || vars.NEWSLETTER_RECIPIENTS }}
          NEWSLETTER_PDF: ${{ github.workspace }}/tybourne-intelligence.pdf
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/send-newsletter-email.mjs

      # Record the send so the rest of this month's runs are no-ops. Only the log is
      # committed (the consolidate above also touched data files; those are left alone).
      # Skipped for a test override: a test must NOT mark the month sent, or the real
      # client send would be skipped afterwards.
      - name: Record the send
        if: ${{ inputs.recipient_override == '' || inputs.recipient_override == null }}
        run: |
          git config user.name "munshot-bot"
          git config user.email "actions@users.noreply.github.com"
          LOG=clients/tybourne/data/email-log.json
          git add "$LOG"
          git commit -m "chore(email): record ${{ needs.gate.outputs.month }} newsletter send [skip ci]" -- "$LOG"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Recorded the send."
              exit 0
            fi
            echo "Push attempt $i failed; retrying in $((2 ** i))s..."
            sleep $((2 ** i))
          done
          echo "::error::The newsletter WAS sent, but recording it failed. Commit $LOG by hand to avoid a re-run re-sending this month."
          exit 1

      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tybourne-intelligence-pdf
          path: ${{ github.workspace }}/tybourne-intelligence.pdf
          if-no-files-found: ignore
