name: Refresh consolidated data

# Re-run the connectors every 6 hours (and on demand), regenerate the AI newsletter,
# and commit the regenerated data files if anything changed.
#
# The connectors need no secrets (all sources are keyless public GETs). The AI
# newsletter writer is OPTIONAL: with the Bedrock key set it writes the editorial
# edition, and WITHOUT it the pipeline still succeeds and writes the honest
# "no-key" state — nothing is fabricated. See README "Secrets & variables".
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-consolidated-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # esbuild is needed to read the Nubank TypeScript data sources.
      - name: Install dependencies
        run: npm ci

      - name: Consolidate (all clients)
        run: node scripts/consolidate.mjs

      # Podcast monthly summaries: one AI summary per month (this + last) from every
      # episode's analysis, plus which themes continued / dropped off / are new. Same
      # Bedrock key as the newsletter; with no key it writes the honest fallback (the
      # episode analyses as published). Cached per month, so unchanged months skip Bedrock.
      - name: Podcast monthly summaries
        continue-on-error: true
        env:
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BEDROCK_MODEL_IDS: ${{ vars.BEDROCK_MODEL_IDS }}
        run: node scripts/podcast-monthly.mjs

      # Regenerate the AI newsletter from the fresh data. Never blocks the data
      # commit: no key -> honest no-key state (exit 0); a model error -> honest
      # error state, still committed. continue-on-error keeps the job green.
      - name: Generate AI newsletter
        continue-on-error: true
        env:
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BEDROCK_MODEL_IDS: ${{ vars.BEDROCK_MODEL_IDS }}
        run: node scripts/newsletter.mjs

      - name: Commit data if changed
        run: |
          git config user.name "munshot-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -z "$(git status --porcelain clients)" ]; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git add clients/*/data/*.json
          git commit -m "chore(data): refresh consolidated + newsletter [skip ci]"
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed refreshed data."
              exit 0
            fi
            echo "Push attempt $i failed; retrying in $((2 ** i))s..."
            sleep $((2 ** i))
          done
          echo "Could not push after retries." >&2
          exit 1
