name: Refresh consolidated data

# Re-run the connectors every 6 hours (and on demand) and commit the regenerated data
# files if anything changed. These runs are DATA-ONLY: no AI call is made, and the last
# AI edition (newsletter prose + podcast month summaries) is kept as it is.
#
# The AI edition is written ONCE A MONTH: the 2nd-of-month run below (ahead of the
# newsletter email) is the only scheduled run given the Bedrock key. To write one by
# hand, run this workflow with "ai_edition" ticked. With no key at all the pipeline
# still succeeds with honest no-key states — nothing is fabricated.
on:
  schedule:
    - cron: '0 */6 * * *'
    # Monthly AI edition — keep in sync with AI_EDITION below.
    - cron: '41 6 2 * *'
  workflow_dispatch:
    inputs:
      ai_edition:
        description: 'Also write the monthly AI edition now (calls Bedrock)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-consolidated-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # 'true' only on the monthly edition run or a manual run with ai_edition ticked.
      AI_EDITION: ${{ github.event.schedule == '41 6 2 * *' || inputs.ai_edition == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # esbuild is needed to read the Nubank TypeScript data sources.
      - name: Install dependencies
        run: npm ci

      - name: Consolidate (all clients)
        run: node scripts/consolidate.mjs

      # Podcast monthly summaries. Every run grows the episode archive; only the edition
      # run gets the key and writes the AI month summaries + theme comparison.
      - name: Podcast monthly summaries
        continue-on-error: true
        env:
          BEDROCK_API_KEY: ${{ env.AI_EDITION == 'true' && secrets.BEDROCK_API_KEY || '' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BEDROCK_MODEL_IDS: ${{ vars.BEDROCK_MODEL_IDS }}
        run: node scripts/podcast-monthly.mjs

      # AI newsletter: written on the edition run only; other runs keep the edition.
      # Never blocks the data commit: a model error -> honest error state, still
      # committed. continue-on-error keeps the job green.
      - name: Generate AI newsletter
        continue-on-error: true
        env:
          BEDROCK_API_KEY: ${{ env.AI_EDITION == 'true' && secrets.BEDROCK_API_KEY || '' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BEDROCK_MODEL_IDS: ${{ vars.BEDROCK_MODEL_IDS }}
        run: node scripts/newsletter.mjs

      - name: Commit data if changed
        run: |
          git config user.name "munshot-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -z "$(git status --porcelain clients)" ]; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git add clients/*/data/*.json
          git commit -m "chore(data): refresh consolidated + newsletter [skip ci]"
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed refreshed data."
              exit 0
            fi
            echo "Push attempt $i failed; retrying in $((2 ** i))s..."
            sleep $((2 ** i))
          done
          echo "Could not push after retries." >&2
          exit 1
