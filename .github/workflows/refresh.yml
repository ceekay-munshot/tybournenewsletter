name: Refresh consolidated data

# Re-run the connectors every 6 hours (and on demand) and commit the regenerated
# data file if anything changed. No secrets — all sources are keyless public GETs.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-consolidated-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The pipeline uses only Node built-ins + global fetch, so no install step.
      - name: Consolidate (all clients)
        run: node scripts/consolidate.mjs

      - name: Commit data if changed
        run: |
          git config user.name "munshot-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -z "$(git status --porcelain clients)" ]; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git add clients/*/data/*.json
          git commit -m "chore(data): refresh consolidated.json [skip ci]"
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed refreshed data."
              exit 0
            fi
            echo "Push attempt $i failed; retrying in $((2 ** i))s..."
            sleep $((2 ** i))
          done
          echo "Could not push after retries." >&2
          exit 1
