name: Refresh consolidated data

# Re-run the connectors every 6 hours (and on demand) and commit the regenerated data
# files if anything changed. Most runs are DATA-ONLY: no AI call is made, and the last
# AI edition (newsletter prose + podcast month summaries) is kept as it is.
#
# The AI edition is written ONCE A MONTH. It is due from the 2nd at 06:00 UTC, and
# EVERY run from then on gives the Bedrock key to the writers until an OK edition for
# this month is on file (scripts/edition-check.mjs edition). So a scheduled run that
# GitHub drops or delays, or a model call that fails, is retried on the next run
# instead of the month being lost. Once the edition is pushed, this workflow starts the
# newsletter email straight away (it also has its own backup schedule).
# To write an edition by hand, run this workflow with "ai_edition" ticked.
on:
  schedule:
    - cron: '0 */6 * * *'
    # Extra run on the 2nd so the edition is written promptly (the 6-hourly runs would
    # pick it up too — this is just one more chance, since GitHub drops some schedules).
    - cron: '41 6 2 * *'
  workflow_dispatch:
    inputs:
      ai_edition:
        description: 'Also write the monthly AI edition now (calls Bedrock)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # start the newsletter email once the edition is pushed

concurrency:
  group: refresh-consolidated-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # esbuild is needed to read the Nubank TypeScript data sources.
      - name: Install dependencies
        run: npm ci

      - name: Consolidate (all clients)
        run: node scripts/consolidate.mjs

      # 'due' = this month's AI edition isn't on file yet (or ai_edition was ticked).
      - name: Is the monthly AI edition due?
        id: edition
        continue-on-error: true # never let the check block the data refresh
        env:
          FORCE_EDITION: ${{ inputs.ai_edition == true }}
        run: node scripts/edition-check.mjs edition

      - name: Check the Bedrock key is set
        if: steps.edition.outputs.due == 'true'
        env:
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
        run: |
          if [ -z "$BEDROCK_API_KEY" ]; then
            echo "::error::This month's AI edition is due but the BEDROCK_API_KEY secret is not set — the newsletter can't be written or sent. Add it under Settings → Secrets and variables → Actions."
          fi

      # Podcast monthly summaries. Every run grows the episode archive; only a run with
      # the edition due gets the key and writes the AI month summaries + theme comparison.
      - name: Podcast monthly summaries
        continue-on-error: true
        env:
          BEDROCK_API_KEY: ${{ steps.edition.outputs.due == 'true' && secrets.BEDROCK_API_KEY || '' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BEDROCK_MODEL_IDS: ${{ vars.BEDROCK_MODEL_IDS }}
        run: node scripts/podcast-monthly.mjs

      # AI newsletter: written only while the edition is due; other runs keep the edition.
      # Never blocks the data commit: on a model error the previous edition is kept, the
      # step shows the failure (continue-on-error keeps the job going), and the next run
      # retries because the edition is still due.
      - name: Generate AI newsletter
        continue-on-error: true
        env:
          BEDROCK_API_KEY: ${{ steps.edition.outputs.due == 'true' && secrets.BEDROCK_API_KEY || '' }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BEDROCK_MODEL_IDS: ${{ vars.BEDROCK_MODEL_IDS }}
        run: node scripts/newsletter.mjs

      - name: Commit data if changed
        run: |
          git config user.name "munshot-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -z "$(git status --porcelain clients)" ]; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git add clients/*/data/*.json
          git commit -m "chore(data): refresh consolidated + newsletter [skip ci]"
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed refreshed data."
              exit 0
            fi
            echo "Push attempt $i failed; retrying in $((2 ** i))s..."
            sleep $((2 ** i))
          done
          echo "Could not push after retries." >&2
          exit 1

      # Hand straight over to the email once this month's edition is pushed. Only from the
      # default branch, so a test run on a feature branch can never email the client. The
      # email workflow re-checks everything itself and sends at most once a month.
      - name: Was this month's edition written?
        id: written
        if: steps.edition.outputs.due == 'true'
        run: node scripts/edition-check.mjs current

      - name: Start the newsletter email
        if: >-
          steps.written.outputs.current == 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run newsletter-email.yml --ref "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
          echo "Started the newsletter email workflow."

      - name: Edition still missing
        if: steps.edition.outputs.due == 'true' && steps.written.outputs.current != 'true'
        run: echo "::warning::This month's AI edition was due but wasn't written this run (see the Generate AI newsletter step). The next refresh run retries it automatically."
